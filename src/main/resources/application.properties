# Configuración de base de datos H2
spring.datasource.url=jdbc:h2:mem:bookhubdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Inicialización de SQL
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true

# Puerto del backend (Render usa la variable PORT)
server.port=${PORT:8080}

# Orígenes permitidos para CORS (se puede sobrescribir con APP_CORS_ALLOWED_ORIGINS)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,https://valenciatatiana.github.io}

